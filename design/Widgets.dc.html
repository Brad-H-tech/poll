<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #9a7000; text-decoration: none; }
    a:hover { color: #6d4f00; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; background: #f5f5f7; font-family: 'DM Sans', -apple-system, 'Segoe UI', sans-serif; color: #17181c; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 56px 16px 0;">

    <!-- header -->
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; color: #8a8a8f; text-transform: uppercase;">Monday, 10 August</div>
        <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.9px; line-height: 1.1; margin-top: 2px;">Sawubona</div>
      </div>
      <div style="width: 38px; height: 38px; border-radius: 50%; background: #17181c; color: #ffcb05; display: grid; place-items: center; font-size: 15px; font-weight: 700;">B</div>
    </div>

    <!-- tile grid -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

      <!-- streak -->
      <div style="background: #ffcb05; border-radius: 22px; padding: 16px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
        <div>
          <div style="font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -1.2px;">5</div>
          <div style="font-size: 12.5px; font-weight: 500; color: rgba(23,24,28,0.62); margin-top: 3px;">day streak</div>
        </div>
      </div>

      <!-- best score -->
      <div style="background: #17181c; color: #ffffff; border-radius: 22px; padding: 16px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffcb05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
        <div>
          <div style="font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -1.2px;">138</div>
          <div style="font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,0.6); margin-top: 3px;">best score</div>
        </div>
      </div>

      <!-- word of the day, wide -->
      <div style="grid-column: span 2; background: #ffffff; border-radius: 22px; padding: 18px 20px; display: flex; align-items: center; gap: 16px;">
        <div style="flex-grow: 1;">
          <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 1.1px; color: #8a8a8f; text-transform: uppercase;">Word of the day</div>
          <div style="font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin-top: 5px;">Amanzi</div>
          <div style="font-size: 14px; font-weight: 400; color: #8a8a8f; margin-top: 3px;">ah-MAHN-zee</div>
        </div>
        <div style="width: 52px; height: 52px; flex: none; border-radius: 50%; background: #ffcb05; display: grid; place-items: center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#17181c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
      </div>

      <!-- proverb, wide -->
      <div style="grid-column: span 2; background: #fff3c2; border-radius: 22px; padding: 18px 20px;">
        <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 1.1px; color: #9a7000; text-transform: uppercase; margin-bottom: 7px;">Today's proverb</div>
        <div style="font-size: 18px; font-weight: 700; line-height: 1.34; letter-spacing: -0.3px;">Izandla ziyagezana.</div>
        <div style="font-size: 13.5px; font-weight: 400; line-height: 1.45; color: rgba(23,24,28,0.6); margin-top: 4px;">Hands wash each other — we rise by helping each other.</div>
      </div>

      <!-- mtn news -->
      <div style="background: #16a34a; color: #ffffff; border-radius: 22px; padding: 16px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"></path></svg>
        <div>
          <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 1.1px; color: rgba(255,255,255,0.75); text-transform: uppercase;">MTN today</div>
          <div style="font-size: 15px; font-weight: 700; line-height: 1.28; margin-top: 4px;">3 new stories</div>
        </div>
      </div>

      <!-- did you know -->
      <div style="background: #ffffff; border-radius: 22px; padding: 16px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#17181c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4"></path></svg>
        <div>
          <div style="font-size: 11.5px; font-weight: 700; letter-spacing: 1.1px; color: #8a8a8f; text-transform: uppercase;">Did you know</div>
          <div style="font-size: 15px; font-weight: 700; line-height: 1.28; margin-top: 4px;">What is a pull request?</div>
        </div>
      </div>
    </div>
  </div>

  <!-- tab bar -->
  <div style="background: rgba(255,255,255,0.95); border-top: 0.5px solid rgba(60,60,67,0.24); display: flex; padding: 9px 0 26px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #17181c;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      <span style="font-size: 10.5px; font-weight: 700;">Today</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a0a0a6;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500;">MTN</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a0a0a6;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><line x1="6" x2="10" y1="11" y2="11"></line><line x1="8" x2="8" y1="9" y2="13"></line><line x1="15" x2="15.01" y1="12" y2="12"></line><line x1="18" x2="18.01" y1="10" y2="10"></line><path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59c0 .05-.1.1-.1.15C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.41.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.55-.6-6.58-.69-7.26 0-.05 0-.1-.01-.15A4 4 0 0 0 17.32 5z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Dlala</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #a0a0a6;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500;">Board</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
