      </div>
    </div>

  <div style="padding: 14px 16px 0;">
    <div style="border: 2px solid #eceef4; border-radius: 18px; padding: 15px 17px; display: flex; align-items: center; gap: 14px;">

      </div>

    </div>
  </div>

  <!-- proverb -->
  <div style="padding: 12px 16px 0;">
    <div style="background: #f7f8fb; border-radius: 18px; padding: 15px 17px;">
      <div style="font-size: 16px; font-weight: 700; letter-spacing: -0.2px;">Izandla ziyagezana.</div>
      <div style="font-size: 13.5px; font-weight: 500; color: #6b7080; margin-top: 4px; line-height: 1.4;">Hands wash each other — we rise by helping each other.</div>
    </div>
  </div>

  <div style="padding: 12px 16px 0;">
    <div style="border: 2px solid #eceef4; border-radius: 18px; padding: 14px 17px; display: flex; align-items: center; gap: 13px;">

        <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6Z"></path></svg>

        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; margin-top: 1px;">3 new stories</div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#c2c6d2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px; flex: none;"><path d="m9 18 6-6-6-6"></path></svg>
    </div>
  </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #e0a800;">
