# Dependabot: GitHub checks the tools this repo relies on and opens a PR
# when one has a security fix or a new version. Free on every GitHub plan.
version: 2
updates:
  - package-ecosystem: "github-actions"   # the CI workflow in .github/workflows
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"              # the Chase API's Node packages
    directory: "/api"
    schedule:
      interval: "weekly"
